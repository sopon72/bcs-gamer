<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BCS Gamer Public Viewer</title>

<link rel="manifest" href="./manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}
header{
  background:#059669;
  padding:20px;
  text-align:center;
}
h1{
  margin:0 0 5px;
}
.tabs{
  display:flex;
  gap:5px;
  padding:10px;
  background:#1f2937;
}
button{
  flex:1;
  padding:12px 5px;
  border:0;
  border-radius:8px;
  background:#374151;
  color:white;
  font-weight:bold;
}
button.active{
  background:#059669;
}
#content{
  padding:15px;
}
.card{
  background:#1f2937;
  margin-bottom:12px;
  padding:15px;
  border-radius:12px;
}
.group{
  border:1px solid #374151;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
}
.match{
  padding:10px;
  border-bottom:1px solid #374151;
}
.match:last-child{
  border-bottom:0;
}
.score{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
}
.error{
  background:#7f1d1d;
  padding:15px;
  border-radius:10px;
}
.small{
  color:#9ca3af;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>BCS Gamer</h1>
  <div>Public Tournament Viewer</div>
</header>

<div class="tabs">
  <button id="fixturesBtn" onclick="showPage('fixtures')">Fixtures</button>
  <button id="resultsBtn" onclick="showPage('results')">Match Results</button>
  <button id="pointsBtn" onclick="showPage('points')">Group Points</button>
</div>

<div id="content">
  Loading...
</div>

<script>

const SUPABASE_URL =
"https://txfissofmkpfizavrpcp.supabase.co";

/*
  এখানে তোমার আগের sb_publishable_... key বসাবে।
*/
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let groups = [];
let teams = [];
let matches = [];

function setActive(page){

  document.querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  if(page === "fixtures")
    document.getElementById("fixturesBtn").classList.add("active");

  if(page === "results")
    document.getElementById("resultsBtn").classList.add("active");

  if(page === "points")
    document.getElementById("pointsBtn").classList.add("active");
}

function teamName(id){

  const team = teams.find(t => t.id === id);

  return team ? team.name : "Unknown Team";
}

function groupName(id){

  const group = groups.find(g => g.id === id);

  return group ? group.name : "Unknown Group";
}

async function loadData(){

  const content = document.getElementById("content");

  content.innerHTML = "Loading...";

  try{

    const groupsResult =
      await supabaseClient
      .from("groups")
      .select("id,name,tournament_id")
      .order("name");

    if(groupsResult.error)
      throw groupsResult.error;

    groups = groupsResult.data || [];

    const teamsResult =
      await supabaseClient
      .from("teams")
      .select("id,name,group_id")
      .order("name");

    if(teamsResult.error)
      throw teamsResult.error;

    teams = teamsResult.data || [];

    const matchesResult =
      await supabaseClient
      .from("matches")
      .select(`
        id,
        tournament_id,
        group_id,
        team_a_id,
        team_b_id,
        score_a,
        score_b,
        status,
        stage
      `)
      .order("id");

    if(matchesResult.error)
      throw matchesResult.error;

    matches = matchesResult.data || [];

    showPage(currentPage);

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="error">
        <b>Data load হয়নি।</b>
        <br><br>
        ${error.message || "Unknown error"}
      </div>
    `;
  }
}

let currentPage = "fixtures";

function showFixtures(){

  let html = `
    <div class="card">
      <h2>আমার Team</h2>

      <select id="teamFilter"
        onchange="showFixtures()"
        style="width:100%;padding:12px;border-radius:8px;font-size:16px;">

        <option value="">সব Team দেখাও</option>

        ${teams.map(t =>
          `<option value="${t.id}">
            ${t.name} — Group ${groupName(t.group_id)}
          </option>`
        ).join("")}

      </select>
    </div>
  `;

  const selected =
    document.getElementById("teamFilter")?.value || "";

  let fixtures = matches.filter(m =>
    m.stage === "group" &&
    (!m.status ||
     m.status === "scheduled" ||
     m.status === "upcoming" ||
     m.status === "pending")
  );

  if(selected){
    fixtures = fixtures.filter(m =>
      m.team_a_id === selected ||
      m.team_b_id === selected
    );
  }

  const groupList = [...groups].sort((a,b) =>
    a.name.localeCompare(b.name)
  );

  groupList.forEach(group => {

    const groupMatches =
      fixtures.filter(m => m.group_id === group.id);

    if(groupMatches.length === 0) return;

    html += `
      <div class="card">
        <h2>Group ${group.name}</h2>
    `;

    groupMatches.forEach(m => {

      html += `
        <div class="match"
          style="
            background:#111827;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
          ">

          <div style="font-size:18px;font-weight:bold;">
            ${teamName(m.team_a_id)}
          </div>

          <div style="
            text-align:center;
            color:#9ca3af;
            margin:8px 0;
            font-weight:bold;
          ">
            VS
          </div>

          <div style="font-size:18px;font-weight:bold;">
            ${teamName(m.team_b_id)}
          </div>

        </div>
      `;

    });

    html += `</div>`;

  });

  if(fixtures.length === 0){

    html += `
      <div class="card">
        এই Team-এর কোনো Fixture নেই।
      </div>
    `;

  }

  document.getElementById("content").innerHTML = html;
}

function showResults(){

  let html = "";

  const results =
    matches.filter(m =>
      m.stage === "group" &&
      (
        m.status === "completed" ||
        m.status === "finished" ||
        m.score_a !== null ||
        m.score_b !== null
      )
    );

  if(results.length === 0){

    html = `
      <div class="card">
        এখনো কোনো Match Result নেই।
      </div>
    `;

  }else{

    results.forEach(m => {

      html += `
        <div class="card">
          <b>${groupName(m.group_id)}</b>

          <div class="match">

            ${teamName(m.team_a_id)}

            <div class="score">
              ${m.score_a ?? 0}
              -
              ${m.score_b ?? 0}
            </div>

            ${teamName(m.team_b_id)}

          </div>
        </div>
      `;

    });
  }

  content.innerHTML = html;
}

function showPoints(){

  let html = "";

  groups.forEach(group => {

    const groupTeams =
      teams.filter(t => t.group_id === group.id);

    const table = {};

    groupTeams.forEach(team => {

      table[team.id] = {
        name: team.name,
        played: 0,
        win: 0,
        draw: 0,
        loss: 0,
        points: 0
      };

    });

    matches
      .filter(m =>
        m.group_id === group.id &&
        m.stage === "group" &&
        m.score_a !== null &&
        m.score_b !== null
      )
      .forEach(m => {

        if(!table[m.team_a_id] || !table[m.team_b_id])
          return;

        const a = Number(m.score_a);
        const b = Number(m.score_b);

        table[m.team_a_id].played++;
        table[m.team_b_id].played++;

        if(a > b){

          table[m.team_a_id].win++;
          table[m.team_a_id].points += 3;

          table[m.team_b_id].loss++;

        }else if(b > a){

          table[m.team_b_id].win++;
          table[m.team_b_id].points += 3;

          table[m.team_a_id].loss++;

        }else{

          table[m.team_a_id].draw++;
          table[m.team_b_id].draw++;

          table[m.team_a_id].points++;
          table[m.team_b_id].points++;
        }

      });

    const rows =
      Object.values(table)
      .sort((a,b) => b.points - a.points);

    html += `
      <div class="card">
        <h2>Group ${group.name}</h2>

        <table style="width:100%;border-collapse:collapse;">
          <tr>
            <th align="left">Team</th>
            <th>MP</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>Pts</th>
          </tr>
    `;

    rows.forEach(r => {

      html += `
        <tr>
          <td style="padding:8px 2px;">
            ${r.name}
          </td>
          <td align="center">${r.played}</td>
          <td align="center">${r.win}</td>
          <td align="center">${r.draw}</td>
          <td align="center">${r.loss}</td>
          <td align="center">
            <b>${r.points}</b>
          </td>
        </tr>
      `;

    });

    html += `
        </table>
      </div>
    `;

  });

  if(!groups.length){

    html = `
      <div class="card">
        কোনো Group পাওয়া যায়নি।
      </div>
    `;
  }

  content.innerHTML = html;
}

showPage("fixtures");

loadData();

setInterval(loadData,10000);

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("./service-worker.js")
    .catch(error => console.log(error));

}

</script>

</body>
  </html>
