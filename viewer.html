<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BCS Gamer Tournament</title>

<link rel="manifest" href="./manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
}

header{
  background:#059669;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

.tabs{
  display:flex;
  gap:6px;
  padding:10px;
  background:#1e293b;
  position:sticky;
  top:0;
  z-index:10;
}

.tabs button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:12px 4px;
  background:#334155;
  color:white;
  font-weight:bold;
  font-size:13px;
}

.tabs button.active{
  background:#059669;
}

#content{
  padding:15px;
  max-width:700px;
  margin:auto;
}

.card{
  background:#1e293b;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.card h2{
  margin-top:0;
  font-size:20px;
}

select{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  font-size:16px;
  background:white;
  color:#111827;
}

.match{
  background:#0f172a;
  border-radius:12px;
  padding:16px;
  margin-top:10px;
}

.team{
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.vs{
  text-align:center;
  color:#94a3b8;
  font-weight:bold;
  margin:9px 0;
}

.group-title{
  color:#34d399;
}

.score{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin:8px 0;
}

.loading{
  text-align:center;
  padding:40px 10px;
  color:#94a3b8;
}

.error{
  background:#7f1d1d;
  padding:16px;
  border-radius:12px;
  line-height:1.6;
}

.empty{
  text-align:center;
  color:#94a3b8;
  padding:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:9px 4px;
  border-bottom:1px solid #334155;
  text-align:center;
}

th:first-child,
td:first-child{
  text-align:left;
}

.qr-box{
  text-align:center;
}

.qr-box img{
  width:220px;
  max-width:100%;
  background:white;
  padding:10px;
  border-radius:10px;
}

.small{
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
  <h1>BCS Gamer</h1>
  <p>Tournament Public Viewer</p>
</header>

<div class="tabs">

  <button id="fixturesBtn"
          onclick="showPage('fixtures')">
    Fixtures
  </button>

  <button id="resultsBtn"
          onclick="showPage('results')">
    Results
  </button>

  <button id="pointsBtn"
          onclick="showPage('points')">
    Points
  </button>

</div>

<div id="content">
  <div class="loading">
    ডাটা লোড হচ্ছে...
  </div>
</div>

<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://txfissofmkpfizavrpcp.supabase.co";

/*
   এখানে তোমার আসল Supabase
   sb_publishable_... key বসাবে।
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =================================
   DATA
================================= */

let groups = [];
let teams = [];
let matches = [];

let currentPage = "fixtures";
let selectedTeam = "";


/* =================================
   TAB
================================= */

function setActive(page){

  document
    .querySelectorAll(".tabs button")
    .forEach(button => {
      button.classList.remove("active");
    });

  if(page === "fixtures"){
    document
      .getElementById("fixturesBtn")
      .classList.add("active");
  }

  if(page === "results"){
    document
      .getElementById("resultsBtn")
      .classList.add("active");
  }

  if(page === "points"){
    document
      .getElementById("pointsBtn")
      .classList.add("active");
  }
}


/* =================================
   PAGE
================================= */

function showPage(page){

  currentPage = page;

  setActive(page);

  if(page === "fixtures"){
    showFixtures();
  }

  if(page === "results"){
    showResults();
  }

  if(page === "points"){
    showPoints();
  }
}


/* =================================
   TEAM NAME
================================= */

function teamName(id){

  const team = teams.find(
    t => String(t.id) === String(id)
  );

  return team
    ? team.name
    : "Unknown Team";
}


/* =================================
   GROUP NAME
================================= */

function groupName(id){

  const group = groups.find(
    g => String(g.id) === String(id)
  );

  return group
    ? group.name
    : "Unknown Group";
}


/* =================================
   LOAD DATA
================================= */

async function loadData(){

  const content =
    document.getElementById("content");

  try{

    content.innerHTML = `
      <div class="loading">
        ডাটা লোড হচ্ছে...
      </div>
    `;


    /* GROUPS */

    const groupsResult =
      await supabaseClient
      .from("groups")
      .select("id,name,tournament_id")
      .order("name");

    if(groupsResult.error){
      throw groupsResult.error;
    }

    groups =
      groupsResult.data || [];


    /* TEAMS */

    const teamsResult =
      await supabaseClient
      .from("teams")
      .select("id,name,group_id")
      .order("name");

    if(teamsResult.error){
      throw teamsResult.error;
    }

    teams =
      teamsResult.data || [];


    /* MATCHES */

    const matchesResult =
      await supabaseClient
      .from("matches")
      .select(`
        id,
        tournament_id,
        group_id,
        team_a_id,
        team_b_id,
        score_a,
        score_b,
        status,
        stage
      `)
      .order("id");

    if(matchesResult.error){
      throw matchesResult.error;
    }

    matches =
      matchesResult.data || [];


    showPage(currentPage);


  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="error">

        <b>ডাটা লোড হয়নি।</b>

        <br><br>

        ${error.message || "Unknown error"}

      </div>
    `;
  }
}


/* =================================
   FIXTURES
================================= */

function showFixtures(){

  let html = `

    <div class="card">

      <h2>আমার Team</h2>

      <select onchange="changeTeam(this.value)">

        <option value="">
          সব Team দেখাও
        </option>

        ${teams.map(team => `

          <option
            value="${team.id}"
            ${String(selectedTeam) === String(team.id)
              ? "selected"
              : ""}
          >

            ${team.name}
            — Group ${groupName(team.group_id)}

          </option>

        `).join("")}

      </select>

    </div>

  `;


  let fixtures =
    matches.filter(match => {

      if(match.stage !== "group"){
        return false;
      }

      /*
        যেসব ম্যাচ এখনো খেলা হয়নি
      */

      return (
        !match.status ||
        match.status === "scheduled" ||
        match.status === "upcoming" ||
        match.status === "pending"
      );

    });


  /* TEAM FILTER */

  if(selectedTeam){

    fixtures =
      fixtures.filter(match =>

        String(match.team_a_id) ===
        String(selectedTeam)

        ||

        String(match.team_b_id) ===
        String(selectedTeam)

      );

  }


  /* GROUP A-H */

  const groupList =
    [...groups].sort((a,b) =>
      a.name.localeCompare(b.name)
    );


  groupList.forEach(group => {

    const groupMatches =
      fixtures.filter(match =>
        String(match.group_id) ===
        String(group.id)
      );


    if(groupMatches.length === 0){
      return;
    }


    html += `

      <div class="card">

        <h2 class="group-title">
          Group ${group.name}
        </h2>

    `;


    groupMatches.forEach(match => {

      html += `

        <div class="match">

          <div class="team">
            ${teamName(match.team_a_id)}
          </div>

          <div class="vs">
            VS
          </div>

          <div class="team">
            ${teamName(match.team_b_id)}
          </div>

        </div>

      `;

    });


    html += `</div>`;

  });


  if(fixtures.length === 0){

    html += `

      <div class="card empty">

        এই Team-এর কোনো Fixture নেই।

      </div>

    `;

  }


  document
    .getElementById("content")
    .innerHTML = html;
}


/* =================================
   CHANGE TEAM
================================= */

function changeTeam(teamId){

  selectedTeam = teamId;

  showFixtures();
}


/* =================================
   RESULTS
================================= */

function showResults(){

  let html = "";


  const results =
    matches.filter(match =>

      match.stage === "group"

      &&

      (
        match.status === "completed"

        ||

        match.status === "finished"

        ||

        match.score_a !== null

        ||

        match.score_b !== null
      )

    );


  if(results.length === 0){

    html = `

      <div class="card empty">

        এখনো কোনো Match Result নেই।

      </div>

    `;

  }


  results.forEach(match => {

    html += `

      <div class="card">

        <h2 class="group-title">
          Group ${groupName(match.group_id)}
        </h2>

        <div class="match">

          <div class="team">
            ${teamName(match.team_a_id)}
          </div>

          <div class="score">

            ${match.score_a ?? 0}
            -
            ${match.score_b ?? 0}

          </div>

          <div class="team">
            ${teamName(match.team_b_id)}
          </div>

        </div>

      </div>

    `;

  });


  document
    .getElementById("content")
    .innerHTML = html;
}


/* =================================
   GROUP POINTS
================================= */

function showPoints(){

  let html = "";


  groups.forEach(group => {

    const groupTeams =
      teams.filter(team =>
        String(team.group_id) ===
        String(group.id)
      );


    const table = {};


    groupTeams.forEach(team => {

      table[String(team.id)] = {

        name: team.name,

        played: 0,

        win: 0,

        draw: 0,

        loss: 0,

        points: 0

      };

    });


    matches

      .filter(match =>

        String(match.group_id) ===
        String(group.id)

        &&

        match.stage === "group"

        &&

        match.score_a !== null

        &&

        match.score_b !== null

      )

      .forEach(match => {

        const aId =
          String(match.team_a_id);

        const bId =
          String(match.team_b_id);


        if(!table[aId] || !table[bId]){
          return;
        }


        const a =
          Number(match.score_a);

        const b =
          Number(match.score_b);


        table[aId].played++;
        table[bId].played++;


        if(a > b){

          table[aId].win++;
          table[aId].points += 3;

          table[bId].loss++;

        }

        else if(b > a){

          table[bId].win++;
          table[bId].points += 3;

          table[aId].loss++;

        }

        else{

          table[aId].draw++;
          table[bId].draw++;

          table[aId].points++;
          table[bId].points++;

        }

      });


    const rows =
      Object.values(table)
      .sort((a,b) =>
        b.points - a.points
      );


    html += `

      <div class="card">

        <h2 class="group-title">
          Group ${group.name}
        </h2>

        <table>

          <tr>

            <th>Team</th>
            <th>MP</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>Pts</th>

          </tr>

    `;


    rows.forEach(row => {

      html += `

        <tr>

          <td>
            ${row.name}
          </td>

          <td>
            ${row.played}
          </td>

          <td>
            ${row.win}
          </td>

          <td>
            ${row.draw}
          </td>

          <td>
            ${row.loss}
          </td>

          <td>
            <b>${row.points}</b>
          </td>

        </tr>

      `;

    });


    html += `

        </table>

      </div>

    `;

  });


  if(groups.length === 0){

    html = `

      <div class="card empty">

        কোনো Group পাওয়া যায়নি।

      </div>

    `;

  }


  document
    .getElementById("content")
    .innerHTML = html;
}


/* =================================
   QR CODE
================================= */

function showQR(){

  const viewerURL =
    window.location.href.split("?")[0];


  const qrURL =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
    +
    encodeURIComponent(viewerURL);


  document
    .getElementById("content")
    .innerHTML = `

      <div class="card qr-box">

        <h2>BCS Gamer Viewer QR</h2>

        <p class="small">
          এই QR Code স্ক্যান করলে
          Tournament Viewer খুলবে।
        </p>

        <img
          src="${qrURL}"
          alt="BCS Gamer QR Code"
        >

        <p class="small">
          QR Code-টি Team/Player-দের
          দেওয়া যাবে।
        </p>

      </div>

    `;
}


/* =================================
   START
================================= */

showPage("fixtures");

loadData();


/* SUPABASE REALTIME */

const realtimeChannel =
  supabaseClient
    .channel("bcs-gamer-live")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "matches"
      },
      () => {
        loadData();
      }
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "teams"
      },
      () => {
        loadData();
      }
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "groups"
      },
      () => {
        loadData();
      }
    )
    .subscribe();

/* SERVICE WORKER */

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("./service-worker.js")
    .catch(error =>
      console.log(error)
    );

}

</script>

</body>
</html>
