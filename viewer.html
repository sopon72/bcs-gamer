<!DOCTYPE html><html lang="bn"><link rel="manifest" href="./manifest.json"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCS Gamer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px;text-align:center}nav{display:flex;gap:6px;padding:10px;background:#fff}button{flex:1;padding:11px;border:0;border-radius:8px}button.active{background:#111827;color:#fff}main{padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#6b7280}.score{font-weight:bold}</style></head><body><header><h2>BCS Gamer</h2><div class="small" style="color:#d1d5db">Public Tournament Viewer</div></header><nav><button id="b1" onclick="show('fixtures')">Fixtures</button><button id="b2" onclick="show('results')">Match Results</button><button id="b3" onclick="show('points')">Group Points</button></nav><main id="app">Loading...</main><script>
const SUPABASE_URL="https://txfissofmkpfizavrpcp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN

তুমি নিজেই বসিয়ে দাও;
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let groups=[],matches=[],current="fixtures";
async function load(){try{let g=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");if(g.error)throw g.error;let m=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,score_a,score_b,status,stage").eq("stage","group");if(m.error)throw m.error;groups=g.data||[];matches=m.data||[];render()}catch(e){document.getElementById("app").innerHTML="<div class='card'>Data load হয়নি।</div>"}}
function tn(id){for(const g of groups){const t=(g.teams||[]).find(x=>x.id===id);if(t)return t.name}return"Unknown Team"}
function gn(id){const g=groups.find(x=>x.id===id);return g?g.name:""}
function done(m){return m.status==="completed"||(m.score_a!==null&&m.score_b!==null)}
function show(x){current=x;["fixtures","results","points"].forEach((p,i)=>document.getElementById("b"+(i+1)).classList.toggle("active",p===x));render()}
function render(){if(current==="fixtures")fix();if(current==="results")res();if(current==="points")pts()}
function fix(){let o="<h2>Fixtures</h2>";matches.forEach(m=>o+=`<div class="card"><b>Group ${gn(m.group_id)}</b><div class="row"><span>${tn(m.team_a_id)}</span><span>vs</span><span>${tn(m.team_b_id)}</span></div><div class="small">${done(m)?"Completed":"Upcoming"}</div></div>`);document.getElementById("app").innerHTML=o}
function res(){let o="<h2>Match Results</h2>",a=matches.filter(done);if(!a.length)o+="<div class='card'>No completed results yet.</div>";a.forEach(m=>o+=`<div class="card"><b>Group ${gn(m.group_id)}</b><div class="row"><span>${tn(m.team_a_id)}</span><span class="score">${m.score_a} - ${m.score_b}</span><span>${tn(m.team_b_id)}</span></div></div>`);document.getElementById("app").innerHTML=o}
function pts(){let o="<h2>Group Points</h2>";groups.forEach(g=>{let ts=(g.teams||[]).map(t=>({id:t.id,name:t.name,p:0,w:0,d:0,l:0})),mp={};ts.forEach(t=>mp[t.id]=t);matches.filter(m=>m.group_id===g.id&&done(m)).forEach(m=>{let a=mp[m.team_a_id],b=mp[m.team_b_id];if(!a||!b)return;if(+m.score_a>+m.score_b){a.p+=3;a.w++;b.l++}else if(+m.score_a<+m.score_b){b.p+=3;b.w++;a.l++}else{a.p++;b.p++;a.d++;b.d++}});ts.sort((a,b)=>b.p-a.p||b.w-a.w);o+=`<div class="card"><b>Group ${g.name}</b>`;ts.forEach(t=>o+=`<div class="row"><span>${t.name}</span><span>${t.p} pts</span></div>`);o+="</div>"});document.getElementById("app").innerHTML=o}
show("fixtures");load();setInterval(load,10000);
</script><script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script></body></html>
