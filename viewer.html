<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCS Gamer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px;text-align:center}nav{display:flex;gap:6px;padding:10px;background:#fff}button{flex:1;padding:11px;border:0;border-radius:8px}button.active{background:#111827;color:#fff}main{padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.team{display:flex;align-items:center;gap:7px;flex:1}.flag{font-size:22px;min-width:30px;display:inline-block;text-align:center}.country{font-size:12px;color:#6b7280}.small{font-size:13px;color:#6b7280}.score{font-weight:bold}</style><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><header><h2>BCS Gamer</h2><div class="small" style="color:#d1d5db">Public Tournament Viewer</div></header><nav><button id="b1" onclick="show('fixtures')">Fixtures</button><button id="b2" onclick="show('results')">Match Results</button><button id="b3" onclick="show('points')">Group Points</button></nav><main id="app">Loading...</main><script>
const SUPABASE_URL="https://txfissofmkpfizavrpcp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const SLOT_MAP={"Team 1": {"flag": "🇧🇩", "country": "Bangladesh"}, "Team 2": {"flag": "🇧🇷", "country": "Brazil"}, "Team 3": {"flag": "🇦🇷", "country": "Argentina"}, "Team 4": {"flag": "🇫🇷", "country": "France"}, "Team 5": {"flag": "🇩🇪", "country": "Germany"}, "Team 6": {"flag": "🇪🇸", "country": "Spain"}, "Team 7": {"flag": "🇵🇹", "country": "Portugal"}, "Team 8": {"flag": "🏴", "country": "England"}, "Team 9": {"flag": "🇳🇱", "country": "Netherlands"}, "Team 10": {"flag": "🇺🇾", "country": "Uruguay"}, "Team 11": {"flag": "🇨🇴", "country": "Colombia"}, "Team 12": {"flag": "🇲🇦", "country": "Morocco"}, "Team 13": {"flag": "🇯🇵", "country": "Japan"}, "Team 14": {"flag": "🇺🇸", "country": "USA"}, "Team 15": {"flag": "🇲🇽", "country": "Mexico"}, "Team 16": {"flag": "🇨🇦", "country": "Canada"}, "Team 17": {"flag": "🇦🇺", "country": "Australia"}, "Team 18": {"flag": "🇮🇷", "country": "Iran"}, "Team 19": {"flag": "🇰🇷", "country": "South Korea"}, "Team 20": {"flag": "🇶🇦", "country": "Qatar"}, "Team 21": {"flag": "🇸🇦", "country": "Saudi Arabia"}, "Team 22": {"flag": "🇺🇿", "country": "Uzbekistan"}, "Team 23": {"flag": "🇯🇴", "country": "Jordan"}, "Team 24": {"flag": "🇮🇶", "country": "Iraq"}, "Team 25": {"flag": "🇿🇦", "country": "South Africa"}, "Team 26": {"flag": "🇪🇬", "country": "Egypt"}, "Team 27": {"flag": "🇩🇿", "country": "Algeria"}, "Team 28": {"flag": "🇸🇳", "country": "Senegal"}, "Team 29": {"flag": "🇨🇮", "country": "Côte d'Ivoire"}, "Team 30": {"flag": "🇬🇭", "country": "Ghana"}, "Team 31": {"flag": "🇹🇳", "country": "Tunisia"}, "Team 32": {"flag": "🇨🇩", "country": "DR Congo"}, "Team 33": {"flag": "🇨🇻", "country": "Cabo Verde"}, "Team 34": {"flag": "🇭🇹", "country": "Haiti"}, "Team 35": {"flag": "🇵🇦", "country": "Panama"}, "Team 36": {"flag": "🇳🇿", "country": "New Zealand"}, "Team 37": {"flag": "🇵🇾", "country": "Paraguay"}, "Team 38": {"flag": "🇪🇨", "country": "Ecuador"}, "Team 39": {"flag": "🇦🇹", "country": "Austria"}, "Team 40": {"flag": "🇧🇪", "country": "Belgium"}, "Team 41": {"flag": "🇭🇷", "country": "Croatia"}, "Team 42": {"flag": "🇨🇿", "country": "Czechia"}, "Team 43": {"flag": "🏴", "country": "Scotland"}, "Team 44": {"flag": "🇳🇴", "country": "Norway"}, "Team 45": {"flag": "🇸🇪", "country": "Sweden"}, "Team 46": {"flag": "🇨🇭", "country": "Switzerland"}, "Team 47": {"flag": "🇹🇷", "country": "Türkiye"}, "Team 48": {"flag": "🇧🇦", "country": "Bosnia and Herzegovina"}};
const FLAGS={"Bangladesh":"🇧🇩","Brazil":"🇧🇷","Argentina":"🇦🇷","France":"🇫🇷","Germany":"🇩🇪","Spain":"🇪🇸","Portugal":"🇵🇹","England":"🏴","Netherlands":"🇳🇱","Uruguay":"🇺🇾","Colombia":"🇨🇴","Morocco":"🇲🇦","Japan":"🇯🇵","USA":"🇺🇸","Mexico":"🇲🇽","Canada":"🇨🇦","Australia":"🇦🇺","Iran":"🇮🇷","South Korea":"🇰🇷","Qatar":"🇶🇦","Saudi Arabia":"🇸🇦","Uzbekistan":"🇺🇿","Jordan":"🇯🇴","Iraq":"🇮🇶","South Africa":"🇿🇦","Egypt":"🇪🇬","Algeria":"🇩🇿","Senegal":"🇸🇳","Ghana":"🇬🇭","Tunisia":"🇹🇳","Ecuador":"🇪🇨","Paraguay":"🇵🇾","New Zealand":"🇳🇿","Austria":"🇦🇹","Belgium":"🇧🇪","Croatia":"🇭🇷","Czechia":"🇨🇿","Scotland":"🏴","Norway":"🇳🇴","Sweden":"🇸🇪","Switzerland":"🇨🇭","Türkiye":"🇹🇷","Turkey":"🇹🇷","Haiti":"🇭🇹","Panama":"🇵🇦","Cabo Verde":"🇨🇻","DR Congo":"🇨🇩","Côte d'Ivoire":"🇨🇮","Bosnia and Herzegovina":"🇧🇦"};
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function teamHTML(name){name=name||"Unknown Team";let meta=null;try{const admin=JSON.parse(localStorage.getItem("bcs_admin")||"null");meta=admin?.teamMeta?.[name]||null;}catch(e){}const slot=SLOT_MAP[name];const flag=meta?.flag||slot?.flag||FLAGS[name]||"🌐";const country=meta?.country||slot?.country||name;return `<span class="team"><span class="flag">${flag}</span><span><b>${esc(name)}</b><div class="country">${esc(country)}</div></span></span>`;}
let groups=[],matches=[],current="fixtures";
async function load(){try{let g=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");if(g.error)throw g.error;let m=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,score_a,score_b,status,stage").eq("stage","group");if(m.error)throw m.error;groups=g.data||[];matches=m.data||[];render()}catch(e){document.getElementById("app").innerHTML="<div class='card'>Data load হয়নি।</div>"}}
function tn(id){for(const g of groups){const t=(g.teams||[]).find(x=>x.id===id);if(t)return t.name}return"Unknown Team"}
function gn(id){const g=groups.find(x=>x.id===id);return g?g.name:""}
function done(m){return m.status==="completed"||(m.score_a!==null&&m.score_b!==null)}
function show(x){current=x;["fixtures","results","points"].forEach((p,i)=>document.getElementById("b"+(i+1)).classList.toggle("active",p===x));render()}
function render(){if(current==="fixtures")fix();if(current==="results")res();if(current==="points")pts()}
function fix(){let o="<h2>Fixtures</h2>";matches.forEach(m=>o+=`<div class="card"><b>Group ${gn(m.group_id)}</b><div class="row">${teamHTML(tn(m.team_a_id))}<span>vs</span>${teamHTML(tn(m.team_b_id))}</div><div class="small">${done(m)?"Completed":"Upcoming"}</div></div>`);document.getElementById("app").innerHTML=o}
function res(){let o="<h2>Match Results</h2>",a=matches.filter(done);if(!a.length)o+="<div class='card'>No completed results yet.</div>";a.forEach(m=>o+=`<div class="card"><b>Group ${gn(m.group_id)}</b><div class="row">${teamHTML(tn(m.team_a_id))}<span class="score">${m.score_a} - ${m.score_b}</span>${teamHTML(tn(m.team_b_id))}</div></div>`);document.getElementById("app").innerHTML=o}
function pts(){let o="<h2>Group Points</h2>";groups.forEach(g=>{let ts=(g.teams||[]).map(t=>({id:t.id,name:t.name,p:0,w:0,d:0,l:0})),mp={};ts.forEach(t=>mp[t.id]=t);matches.filter(m=>m.group_id===g.id&&done(m)).forEach(m=>{let a=mp[m.team_a_id],b=mp[m.team_b_id];if(!a||!b)return;if(+m.score_a>+m.score_b){a.p+=3;a.w++;b.l++}else if(+m.score_a<+m.score_b){b.p+=3;b.w++;a.l++}else{a.p++;b.p++;a.d++;b.d++}});ts.sort((a,b)=>b.p-a.p||b.w-a.w);o+=`<div class="card"><b>Group ${g.name}</b>`;ts.forEach(t=>o+=`<div class="row">${teamHTML(t.name)}<span>${t.p} pts</span></div>`);o+="</div>"});document.getElementById("app").innerHTML=o}
show("fixtures");load();setInterval(load,10000);
if ('serviceWorker' in navigator) { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=4')); }
</script></body></html>
