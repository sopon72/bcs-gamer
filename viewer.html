<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCS Gamer Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:22px 14px;text-align:center}header h1{margin:0 0 8px}
nav{display:flex;gap:8px;padding:10px;background:#fff;overflow:auto;position:sticky;top:0;z-index:5}
button{flex:0 0 auto;padding:12px 16px;border:0;border-radius:10px;background:#eee;color:#172033;font-size:15px}
button.active{background:#111827;color:#fff}main{padding:16px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.match{padding:13px 0;border-bottom:1px solid #e5e7eb}.match:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;text-align:center}
.score{font-weight:800;font-size:18px}.small{font-size:13px;color:#6b7280}h2{margin-top:4px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px 4px;border-bottom:1px solid #e5e7eb;text-align:center}.table .left{text-align:left}
.status{margin-top:10px;color:#6b7280}.live{color:#059669;font-weight:700}
@media(max-width:520px){.row{grid-template-columns:1fr 58px 1fr}.table{font-size:13px}}
</style></head><body>
<header><h1>BCS Gamer</h1><div style="color:#d1d5db">Public Tournament Viewer</div></header>
<nav>
<button id="b1" onclick="show('fixtures')">Fixtures</button>
<button id="b2" onclick="show('results')">Match Results</button>
<button id="b3" onclick="show('points')">Group Points</button>
<button id="b4" onclick="show('goals')">⚽ Goal Ranking</button><button id="b5" onclick="show('top')">🏅 Top Scorers</button><button id="b6" onclick="show('teams')">👥 Teams</button><button id="b7" onclick="show('knockout')">🏆 Knockout</button><button id="b8" onclick="show('announcement')">📢 Announcement</button>
</nav>
<main id="app">Loading...</main>
<script>
const SUPABASE_URL="https://txfissofmkpfizavrpcp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let groups=[],matches=[],goalEvents=[],players=[],announcements=[],current="fixtures";
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function tn(id){for(const g of groups){const t=(g.teams||[]).find(x=>x.id===id);if(t)return t.name}return "Unknown Team"}
function gn(id){const g=groups.find(x=>x.id===id);return g?g.name:""}
function done(m){return m.status==="completed"||(m.score_a!==null&&m.score_b!==null)}
async function load(){try{
 const g=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");
 if(g.error)throw g.error;
 const m=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,score_a,score_b,status,stage").eq("stage","group").order("id");
 if(m.error)throw m.error;
 groups=(g.data||[]).map(x=>({...x,teams:(x.teams||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)))}));
 matches=m.data||[];goalEvents=ge.error?[]:(ge.data||[]);players=pl.error?[]:(pl.data||[]);announcements=an.error?[]:(an.data||[]);
 render();
}catch(e){document.getElementById("app").innerHTML="<div class='card'>Data load হয়নি। একটু পরে আবার চেষ্টা করুন।</div>"}}
function show(x){current=x;for(let i=1;i<=8;i++){const b=document.getElementById("b"+i);if(b)b.classList.remove("active")}const map={fixtures:"b1",results:"b2",points:"b3",goals:"b4",top:"b5",teams:"b6",knockout:"b7",announcement:"b8"};if(document.getElementById(map[x]))document.getElementById(map[x]).classList.add("active");render()}
function render(){if(current==="fixtures")fix();if(current==="results")res();if(current==="points")pts();if(current==="goals")goals();if(current==="top")top();if(current==="teams")teamsPage();if(current==="knockout")knockoutPage();if(current==="announcement")announcementPage()}
function fix(){let o="<h2>Fixtures</h2>";matches.forEach(m=>{const A=tn(m.team_a_id),B=tn(m.team_b_id);o+=`<div class="card match"><b>Group ${esc(gn(m.group_id))}</b><div class="row"><span>${esc(fa[0])} <b>${esc(A)}</b><br><span class=small>${esc(fa[1])}</span></span><span>VS</span><span><b>${esc(B)}</b> ${esc(fb[0])}<br><span class=small>${esc(fb[1])}</span></span></div><div class=status>${done(m)?`<span class=live>Completed • ${m.score_a} - ${m.score_b}</span>`:"Upcoming"}</div></div>`});document.getElementById("app").innerHTML=o}
function res(){let a=matches.filter(done),o="<h2>Match Results</h2>";if(!a.length)o+="<div class='card'>No completed results yet.</div>";a.forEach(m=>o+=`<div class="card"><b>Group ${esc(gn(m.group_id))}</b><div class="row"><span>${esc(tn(m.team_a_id))}</span><span class=score>${m.score_a} - ${m.score_b}</span><span>${esc(tn(m.team_b_id))}</span></div></div>`);document.getElementById("app").innerHTML=o}
function pts(){let o="<h2>Group Points</h2>";groups.forEach(g=>{let ts=(g.teams||[]).map(t=>({id:t.id,name:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0})),mp={};ts.forEach(t=>mp[t.id]=t);matches.filter(m=>m.group_id===g.id&&done(m)).forEach(m=>{let a=mp[m.team_a_id],b=mp[m.team_b_id];if(!a||!b)return;a.gf+=+m.score_a;a.ga+=+m.score_b;b.gf+=+m.score_b;b.ga+=+m.score_a;if(+m.score_a>+m.score_b){a.p+=3;a.w++;b.l++}else if(+m.score_a<+m.score_b){b.p+=3;b.w++;a.l++}else{a.p++;b.p++;a.d++;b.d++}});ts.sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);o+=`<div class="card"><h3>Group ${esc(g.name)}</h3><table class=table><tr><th>#</th><th class=left>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>`;ts.forEach((t,i)=>o+=`<tr><td>${i+1}</td><td class=left>${esc(t.name)}</td><td>${matches.filter(m=>(m.team_a_id===t.id||m.team_b_id===t.id)&&m.group_id===g.id&&done(m)).length}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td><b>${t.p}</b></td></tr>`);o+="</table></div>"});document.getElementById("app").innerHTML=o}
function goals(){const totals={};goalEvents.forEach(e=>{const k=String(e.player_name||"").trim().toLowerCase();if(!k)return;if(!totals[k])totals[k]={name:e.player_name,team:tn(e.team_id),goals:0};totals[k].goals+=Number(e.goals||0)});const rows=Object.values(totals).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name)).slice(0,10);document.getElementById("app").innerHTML="<h2>⚽ Goal Ranking — Top 10</h2>"+(rows.length?rows.map((t,i)=>`<div class=card><div class=row><b>#${i+1}</b><span style='text-align:left'><b>${esc(t.name)}</b><br><span class=small>${esc(t.team)}</span></span><span class=score>${t.goals} ⚽</span></div></div>`).join(""):"<div class=card>No goal scorers yet.</div>")}
function top(){goals()}
function teamsPage(){let o="<h2>👥 Teams & Players</h2>";groups.forEach(g=>{o+=`<div class=card><h3>Group ${esc(g.name)}</h3>`;(g.teams||[]).forEach(t=>{const ps=players.filter(p=>p.team_id===t.id);o+=`<div class=match><b>${esc(t.name)}</b><div class=small>${ps.length?ps.map(p=>esc(p.name)).join(" • "):"Players not added yet"}</div></div>`});o+="</div>"});document.getElementById("app").innerHTML=o}
function knockoutPage(){const a=matches.filter(m=>m.stage&&m.stage!=="group");let o="<h2>🏆 Knockout</h2>";if(!a.length)o+="<div class=card>Knockout matches will appear here when available.</div>";a.forEach(m=>o+=`<div class=card><b>${esc(String(m.stage||"Knockout"))}</b><div class=row><span>${esc(tn(m.team_a_id))}</span><span class=score>${done(m)?m.score_a+" - "+m.score_b:"VS"}</span><span>${esc(tn(m.team_b_id))}</span></div></div>`);document.getElementById("app").innerHTML=o}
function announcementPage(){let o="<h2>📢 Announcement</h2>";if(!announcements.length)o+="<div class=card>No announcement yet.</div>";announcements.forEach(a=>{const title=a.title||a.name||"Announcement",body=a.body||a.message||a.content||a.text||"";o+=`<div class=card><h3>${esc(title)}</h3><div>${esc(body)}</div></div>`});document.getElementById("app").innerHTML=o}
show("fixtures");load();setInterval(load,2000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
