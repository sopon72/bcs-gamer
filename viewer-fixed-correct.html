<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCS Gamer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px;text-align:center}nav{display:flex;gap:6px;padding:10px;background:#fff;position:sticky;top:0;z-index:2}button{flex:1;padding:11px;border:0;border-radius:8px;background:#e5e7eb}button.active{background:#111827;color:#fff}main{padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.team{display:flex;align-items:center;gap:7px;flex:1;min-width:0}.flag{font-size:22px;min-width:30px;text-align:center}.country{font-size:12px;color:#6b7280}.small{font-size:13px;color:#6b7280}.score{font-weight:bold;white-space:nowrap}.error{color:#b91c1c}.groupTitle{margin-top:4px}.status{font-size:12px;color:#6b7280;margin-top:6px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}th.left,td.left{text-align:left}.ok{background:#f0fdf4}</style><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><header><h2>BCS Gamer</h2><div class="small" style="color:#d1d5db">Public Tournament Viewer</div></header><nav><button id="b1" onclick="show('fixtures')">Fixtures</button><button id="b2" onclick="show('results')">Match Results</button><button id="b3" onclick="show('points')">Group Points</button></nav><main id="app">Loading...</main><script>
const SUPABASE_URL="https://txfissofmkpfizavrpcp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const SLOT_MAP={"Team 1":["🇧🇩","Bangladesh"],"Team 2":["🇧🇷","Brazil"],"Team 3":["🇦🇷","Argentina"],"Team 4":["🇫🇷","France"],"Team 5":["🇩🇪","Germany"],"Team 6":["🇪🇸","Spain"],"Team 7":["🇵🇹","Portugal"],"Team 8":["🏴","England"],"Team 9":["🇳🇱","Netherlands"],"Team 10":["🇺🇾","Uruguay"],"Team 11":["🇨🇴","Colombia"],"Team 12":["🇲🇦","Morocco"],"Team 13":["🇯🇵","Japan"],"Team 14":["🇺🇸","USA"],"Team 15":["🇲🇽","Mexico"],"Team 16":["🇨🇦","Canada"],"Team 17":["🇦🇺","Australia"],"Team 18":["🇮🇷","Iran"],"Team 19":["🇰🇷","South Korea"],"Team 20":["🇶🇦","Qatar"],"Team 21":["🇸🇦","Saudi Arabia"],"Team 22":["🇺🇿","Uzbekistan"],"Team 23":["🇯🇴","Jordan"],"Team 24":["🇮🇶","Iraq"],"Team 25":["🇿🇦","South Africa"],"Team 26":["🇪🇬","Egypt"],"Team 27":["🇩🇿","Algeria"],"Team 28":["🇸🇳","Senegal"],"Team 29":["🇨🇮","Côte d'Ivoire"],"Team 30":["🇬🇭","Ghana"],"Team 31":["🇹🇳","Tunisia"],"Team 32":["🇨🇩","DR Congo"],"Team 33":["🇨🇻","Cabo Verde"],"Team 34":["🇭🇹","Haiti"],"Team 35":["🇵🇦","Panama"],"Team 36":["🇳🇿","New Zealand"],"Team 37":["🇵🇾","Paraguay"],"Team 38":["🇪🇨","Ecuador"],"Team 39":["🇦🇹","Austria"],"Team 40":["🇧🇪","Belgium"],"Team 41":["🇭🇷","Croatia"],"Team 42":["🇨🇿","Czechia"],"Team 43":["🏴","Scotland"],"Team 44":["🇳🇴","Norway"],"Team 45":["🇸🇪","Sweden"],"Team 46":["🇨🇭","Switzerland"],"Team 47":["🇹🇷","Türkiye"],"Team 48":["🇧🇦","Bosnia and Herzegovina"]};
const FLAGS={"Bangladesh":"🇧🇩","Brazil":"🇧🇷","Argentina":"🇦🇷","France":"🇫🇷","Germany":"🇩🇪","Spain":"🇪🇸","Portugal":"🇵🇹","England":"🏴","Netherlands":"🇳🇱","Uruguay":"🇺🇾","Colombia":"🇨🇴","Morocco":"🇲🇦","Japan":"🇯🇵","USA":"🇺🇸","Mexico":"🇲🇽","Canada":"🇨🇦","Australia":"🇦🇺","Iran":"🇮🇷","South Korea":"🇰🇷","Qatar":"🇶🇦","Saudi Arabia":"🇸🇦","Uzbekistan":"🇺🇿","Jordan":"🇯🇴","Iraq":"🇮🇶","South Africa":"🇿🇦","Egypt":"🇪🇬","Algeria":"🇩🇿","Senegal":"🇸🇳","Côte d'Ivoire":"🇨🇮","Ghana":"🇬🇭","Tunisia":"🇹🇳","DR Congo":"🇨🇩","Cabo Verde":"🇨🇻","Haiti":"🇭🇹","Panama":"🇵🇦","New Zealand":"🇳🇿","Paraguay":"🇵🇾","Ecuador":"🇪🇨","Austria":"🇦🇹","Belgium":"🇧🇪","Croatia":"🇭🇷","Czechia":"🇨🇿","Scotland":"🏴","Norway":"🇳🇴","Sweden":"🇸🇪","Switzerland":"🇨🇭","Türkiye":"🇹🇷","Turkey":"🇹🇷","Bosnia and Herzegovina":"🇧🇦"};
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
let groups=[],matches=[],current="fixtures";
function meta(name){if(SLOT_MAP[name])return SLOT_MAP[name];if(FLAGS[name])return [FLAGS[name],name];return ["🌐",name||"Unknown Team"]}
function teamHTML(name){const [flag,country]=meta(name);return `<span class="team"><span class="flag">${flag}</span><span><b>${esc(name||"Unknown Team")}</b><div class="country">${esc(country)}</div></span></span>`}
function teamById(id){for(const g of groups){const t=(g.teams||[]).find(x=>x.id===id);if(t)return t}return null}
function groupById(id){return groups.find(g=>g.id===id)||null}
function matchOrder(m,g){const ts=(g.teams||[]);const a=ts.findIndex(t=>t.id===m.team_a_id),b=ts.findIndex(t=>t.id===m.team_b_id);const pairs=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];const n=pairs.findIndex(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));return n<0?99:n}
function done(m){return m.status==="completed"||(m.score_a!==null&&m.score_b!==null)}
async function load(){try{const g=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");if(g.error)throw g.error;const m=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,score_a,score_b,status,stage").eq("stage","group");if(m.error)throw m.error;groups=(g.data||[]).filter(x=>/^[A-L]$/i.test(String(x.name).trim())).sort((a,b)=>String(a.name).localeCompare(String(b.name)));groups.forEach(g=>g.teams=(g.teams||[]).sort((a,b)=>String(a.id).localeCompare(String(b.id))));matches=(m.data||[]).filter(x=>groups.some(g=>g.id===x.group_id));render()}catch(e){console.error(e);document.getElementById("app").innerHTML=`<div class="card error"><b>Data load হয়নি</b><div class="small">${esc(e.message||e)}</div></div>`}}
function show(x){current=x;["fixtures","results","points"].forEach((p,i)=>document.getElementById("b"+(i+1)).classList.toggle("active",p===x));render()}
function render(){if(current==="fixtures")fix();else if(current==="results")res();else pts()}
function fix(){let o="<h2>Fixtures</h2>";for(const g of groups){const ms=matches.filter(m=>m.group_id===g.id).sort((a,b)=>matchOrder(a,g)-matchOrder(b,g));if(!ms.length)continue;o+=`<div class="card"><h3 class="groupTitle">Group ${esc(g.name)}</h3>`;for(const m of ms){const a=teamById(m.team_a_id)?.name||"Unknown Team",b=teamById(m.team_b_id)?.name||"Unknown Team";o+=`<div class="row">${teamHTML(a)}<span>vs</span>${teamHTML(b)}</div><div class="status">Match ${matchOrder(m,g)+1} • ${done(m)?"Completed":"Upcoming"}</div>`}o+="</div>"}if(!o.includes("class="card""))o+="<div class='card'>কোনো Fixture পাওয়া যায়নি। Admin-এ Random Draw/Fixture তৈরি হয়েছে কি না দেখো।</div>";document.getElementById("app").innerHTML=o}
function res(){let o="<h2>Match Results</h2>";for(const g of groups){const ms=matches.filter(m=>m.group_id===g.id&&done(m)).sort((a,b)=>matchOrder(a,g)-matchOrder(b,g));if(!ms.length)continue;o+=`<div class="card"><h3>Group ${esc(g.name)}</h3>`;for(const m of ms){const a=teamById(m.team_a_id)?.name||"Unknown Team",b=teamById(m.team_b_id)?.name||"Unknown Team";o+=`<div class="row">${teamHTML(a)}<span class="score">${m.score_a} - ${m.score_b}</span>${teamHTML(b)}</div>`}o+="</div>"}if(!o.includes("class="card""))o+="<div class='card'>No completed results yet.</div>";document.getElementById("app").innerHTML=o}
function pts(){let o="<h2>Group Points</h2>";for(const g of groups){const ts=(g.teams||[]).map(t=>({id:t.id,name:t.name,mp:0,w:0,d:0,l:0,gf:0,ga:0,p:0})),mp={};ts.forEach(t=>mp[t.id]=t);matches.filter(m=>m.group_id===g.id&&done(m)).forEach(m=>{const a=mp[m.team_a_id],b=mp[m.team_b_id];if(!a||!b)return;a.mp++;b.mp++;a.gf+=+m.score_a;a.ga+=+m.score_b;b.gf+=+m.score_b;b.ga+=+m.score_a;if(+m.score_a>+m.score_b){a.w++;a.p+=3;b.l++}else if(+m.score_a<+m.score_b){b.w++;b.p+=3;a.l++}else{a.d++;b.d++;a.p++;b.p++}});ts.sort((a,b)=>b.p-a.p||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf);o+=`<div class="card"><h3>Group ${esc(g.name)}</h3><table><tr><th>#</th><th class="left">Team</th><th>MP</th><th>Pts</th></tr>`;ts.forEach((t,i)=>o+=`<tr class="${i<2?'ok':''}"><td>${i+1}</td><td class="left">${teamHTML(t.name)}</td><td>${t.mp}</td><td><b>${t.p}</b></td></tr>`);o+="</table></div>"}document.getElementById("app").innerHTML=o}
show("fixtures");load();setInterval(load,10000);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=5"));}
</script></body></html>
