<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}header{padding:18px;text-align:center;background:linear-gradient(135deg,#123b73,#087f5b)}h1{margin:0}main{max-width:1100px;margin:auto;padding:14px}.panel,.card{background:#111c2d;border-radius:14px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}input,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #334155}input,select{width:100%;background:#0b1525;color:#fff}button{cursor:pointer;background:#243047;color:#fff}button.primary{background:#10b981;color:#03251b;border:0;font-weight:bold}.danger{background:#7f1d1d}.tabs{display:flex;gap:7px;overflow:auto;padding:8px;background:#0d1727;position:sticky;top:0;z-index:4}.tabs button{white-space:nowrap}.tabs button.active{background:#10b981;color:#05271e}table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid #334155;text-align:center}th{color:#a7f3d0}.left{text-align:left}.ok{color:#6ee7b7}.small{font-size:13px;color:#9ca3af}.match{padding:10px;border-bottom:1px solid #334155}.row{display:grid;grid-template-columns:1fr 65px 65px 1fr;gap:6px;align-items:center}.row input{text-align:center}.msg{padding:10px;border-radius:8px;background:#123524;color:#a7f3d0;margin-bottom:10px}.drawbox{border:1px solid #10b981}.done{border:1px solid #334155}.knock{border:1px solid #334155}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.place{background:#0b1525;border-radius:12px;padding:14px;text-align:center}.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#1e293b;display:block;margin:0 auto 8px}.flag{font-size:22px}.champ{border:1px solid #10b981}.muted{color:#9ca3af}.scorer{display:grid;grid-template-columns:42px 1fr 150px 70px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #334155}.country{font-size:14px;color:#cbd5e1}.rank{font-weight:bold;color:#a7f3d0}.player-input{margin:4px 0}.goalbox{font-weight:bold;text-align:center;background:#0b1525}#login{max-width:420px;margin:50px auto;padding:20px}@media(max-width:600px){.podium{grid-template-columns:1fr}.row{grid-template-columns:1fr 55px 55px 1fr}}
</style></head><body>
<header><h1>⚽ BCS Gamer</h1><div>Admin Tournament Control Panel</div></header>
<div id="login" class="panel"><h2>🔐 Admin Login</h2><p class="small">ডেমো Admin PIN: <b>1234</b></p><input id="pin" type="password" placeholder="Admin PIN"><br><br><button class="primary" onclick="login()">Login</button><p id="loginmsg"></p></div>
<div id="app" style="display:none"><div class="tabs" id="tabs"></div><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://txfissofmkpfizavrpcp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_SUQ_jBXrre6ClvPyxZBZxg_aYYIieEN";
let supabaseClient=null;if(window.supabase&&SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_"))supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ALL_GROUPS="ABCDEFGHIJKL".split("");
const SIZE_OPTIONS=[16,24,32,48];
let data=JSON.parse(localStorage.getItem("bcs_admin")||"null")||{teams:{},results:{},announcement:"",tournament:"BCS Gamer Tournament",drawDone:false,status:"active",knockout:{},teamMeta:{},podium:null,tournamentSize:32};
data.tournamentSize=SIZE_OPTIONS.includes(Number(data.tournamentSize))?Number(data.tournamentSize):32;
const activeGroupCount=()=>data.tournamentSize/4;
const groups=()=>ALL_GROUPS.slice(0,activeGroupCount());
const defaultTeams={};ALL_GROUPS.forEach((g,gi)=>defaultTeams[g]=Array.from({length:4},(_,i)=>`Team ${gi*4+i+1}`));
ALL_GROUPS.forEach(g=>{if(!data.teams[g])data.teams[g]=defaultTeams[g]});
data.drawDone=!!data.drawDone;data.status=data.status||"active";data.knockout=data.knockout||{};data.teamMeta=data.teamMeta||{};data.players=data.players||{};data.goalEvents=data.goalEvents||[];
const DEFAULT_COUNTRIES=[
  ["🇧🇩","Bangladesh"],["🇨🇦","Canada"],["🇲🇽","Mexico"],["🇺🇸","USA"],
  ["🇦🇺","Australia"],["🇮🇶","Iraq"],["🇮🇷","Iran"],["🇯🇵","Japan"],["🇯🇴","Jordan"],["🇰🇷","South Korea"],["🇶🇦","Qatar"],["🇸🇦","Saudi Arabia"],
  ["🇺🇿","Uzbekistan"],["🇩🇿","Algeria"],["🇨🇻","Cabo Verde"],["🇨🇩","DR Congo"],["🇨🇮","Côte d'Ivoire"],["🇪🇬","Egypt"],["🇬🇭","Ghana"],["🇲🇦","Morocco"],["🇸🇳","Senegal"],["🇿🇦","South Africa"],["🇹🇳","Tunisia"],
  ["🇭🇹","Haiti"],["🇵🇦","Panama"],
  ["🇦🇷","Argentina"],["🇧🇷","Brazil"],["🇨🇴","Colombia"],["🇪🇨","Ecuador"],["🇵🇾","Paraguay"],["🇺🇾","Uruguay"],
  ["🇳🇿","New Zealand"],
  ["🇦🇹","Austria"],["🇧🇪","Belgium"],["🇧🇦","Bosnia and Herzegovina"],["🇭🇷","Croatia"],["🇨🇿","Czechia"],["🏴","England"],["🇫🇷","France"],["🇩🇪","Germany"],["🇳🇱","Netherlands"],["🇳🇴","Norway"],["🇵🇹","Portugal"],["🏴","Scotland"],["🇪🇸","Spain"],["🇸🇪","Sweden"],["🇨🇭","Switzerland"],["🇹🇷","Türkiye"]
];
function seedDefaultFlags(){
  const all=[]; groups().forEach(g=>(data.teams[g]||[]).forEach(t=>all.push(t)));
  all.slice(0,data.tournamentSize).forEach((team,i)=>{
    const old=data.teamMeta[team]||{};
    data.teamMeta[team]={flag:(DEFAULT_COUNTRIES[i]||["🏳️","Unknown"])[0],country:(DEFAULT_COUNTRIES[i]||["🏳️","Unknown"])[1]};
  });
  save();
}
function save(){localStorage.setItem("bcs_admin",JSON.stringify(data))}
function login(){if(document.getElementById("pin").value==="1234"){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";init()}else document.getElementById("loginmsg").textContent="ভুল PIN"}
async function init(){
 tabs.innerHTML="";["dashboard","teams","fixtures","results","groupPoints","knockout","topScorers","announcement"].forEach((p,i)=>{let b=document.createElement("button");b.textContent={dashboard:"Dashboard",teams:"Teams",fixtures:"Fixtures",results:"Match Results",groupPoints:"Group Points",knockout:"🏆 Knockout",topScorers:"⚽ Top Scorers",announcement:"Announcement"}[p];b.onclick=()=>show(p);b.dataset.p=p;if(i===0)b.className="active";tabs.appendChild(b)});
 if(supabaseClient){await loadTeamsFromSupabase();await loadResultsFromSupabase()}seedDefaultFlags();show("dashboard")
}
async function loadTeamsFromSupabase(){try{const {data:rows,error}=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");if(error)throw error;if(rows&&rows.length){const fresh={};rows.forEach(group=>{const g=String(group.name).trim().toUpperCase();if(/^[A-L]$/.test(g))fresh[g]=(group.teams||[]).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(t=>t.name)});groups().forEach(g=>{if(!fresh[g])fresh[g]=[]});data.teams=fresh;save()}}catch(e){console.warn(e)}}
async function loadResultsFromSupabase(){try{const {data:rows,error}=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,score_a,score_b,status,stage,groups(name,teams(id,name))").eq("stage","group");if(error)throw error;const out={};(rows||[]).forEach(m=>{if(m.status!=="completed"||m.score_a===null||m.score_b===null)return;const g=String(m.groups?.name||"").trim().toUpperCase();const ts=m.groups?.teams||[];const A=ts.find(t=>t.id===m.team_a_id),B=ts.find(t=>t.id===m.team_b_id);if(g&&A&&B){const x=fixtures().find(z=>z.g===g&&z.a===A.name&&z.b===B.name);if(x)out[x.id]={a:Number(m.score_a),b:Number(m.score_b)}}});data.results=out;save()}catch(e){console.warn(e)}}
function nav(p){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x.dataset.p===p))}
function show(p){nav(p);if(p==="dashboard")dashboard();if(p==="teams")teamPage();if(p==="fixtures")fixturePage();if(p==="results")resultPage();if(p==="groupPoints")groupPointsPage();if(p==="knockout")knockoutPage();if(p==="topScorers")topScorersPage();if(p==="announcement")announcePage()}
function dashboard(){main.innerHTML=`<section class=panel><h2>🏆 ${esc(data.tournament)}</h2><div class=grid><div class=card><h3>Teams</h3><b>${data.tournamentSize}</b></div><div class=card><h3>Groups</h3><b>${groups().length}</b></div><div class=card><h3>Group Matches</h3><b>${groups().length*6}</b></div><div class=card><h3>Knockout</h3><b>R16 → QF → SF → Final</b></div></div><p class=small>${data.drawDone?"🎲 Random Group Draw সম্পন্ন হয়েছে।":"🎲 Random Group Draw এখনো করা হয়নি।"}</p>${data.status==="finished"?`<p class=msg>🏆 Tournament Finished</p>${podiumHTML()}`:""}<button class="danger" onclick="resetTournament()">🔄 Reset Tournament</button><p class=small>Reset করলে এই Tournament-এর Draw, ফলাফল, পয়েন্ট ও Knockout মুছে যাবে। নতুন করে Random Draw করা যাবে।</p></section>`}
function teamPage(){let h=`<section class=panel><h2>👥 Team Management</h2><p class=small>৪৮টি Team slot-এ World Cup-এর পতাকা দেওয়া আছে। Bangladesh-ও রাখা হয়েছে। শুধু Team-এর নাম তুমি নিজে পরিবর্তন করতে পারবে। Logo URL বা আলাদা Flag input নেই।</p></section><div class=grid>`;for(let g of groups()){h+=`<section class=card><h3>Group ${g}</h3>`;data.teams[g].forEach((t,i)=>{let m=data.teamMeta[t]||{};h+=`<div style="margin-bottom:12px"><div class="small">${m.flag||"🏳️"} <span class="country">${esc(m.country||"Unknown")}</span></div><label>Team ${i+1}<input id="${g}${i}" value="${esc(t)}"></label><div class="small">Player names (later you can fill these in)</div>${[0,1,2,3].map(pi=>`<input class="player-input" id="pl_${g}_${i}_${pi}" placeholder="Player ${pi+1} name" value="${esc(((data.players[t]||[])[pi]||""))}">`).join("")}</div>`});h+=`<button class=primary onclick="saveTeams('${g}')">Save Group ${g}</button></section>`}main.innerHTML=h+"</div>"}
async function saveTeams(g){const names=[0,1,2,3].map(i=>document.getElementById(g+i).value.trim()||`Team ${i+1}`);const old=data.teams[g]||[];const oldPlayers={};old.forEach((t,i)=>{oldPlayers[t]=(data.players[t]||[])});data.teams[g]=names;names.forEach((n,i)=>{let oldName=old[i],m=data.teamMeta[oldName]||{};data.teamMeta[n]={...m};if(oldName&&oldName!==n&&data.teamMeta[oldName])delete data.teamMeta[oldName];if(oldName&&oldName!==n&&data.players[oldName]){data.players[n]=data.players[oldName];delete data.players[oldName]}});names.forEach((n,i)=>{data.players[n]=[0,1,2,3].map(pi=>document.getElementById(`pl_${g}_${i}_${pi}`).value.trim()).filter(Boolean)});save();if(supabaseClient){try{const {data:rows,error}=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)");if(error)throw error;const gr=(rows||[]).find(x=>String(x.name).trim().toUpperCase()===g);if(!gr)throw new Error("Group not found");const ts=(gr.teams||[]).sort((a,b)=>String(a.name).localeCompare(String(b.name)));for(let i=0;i<Math.min(4,ts.length);i++){const {error:e}=await supabaseClient.from("teams").update({name:names[i]}).eq("id",ts[i].id);if(e)throw e}}catch(e){console.warn(e)}}teamPage()}
function fixtures(){let a=[];for(let g of groups()){let t=data.teams[g]||[];[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]].forEach((p,i)=>a.push({id:g+(i+1),g,a:t[p[0]]||"TBD",b:t[p[1]]||"TBD"}))}return a}
function setTournamentSize(v){if(data.drawDone){alert("Draw হয়ে যাওয়ার পর Tournament Size বদলানো যাবে না। Reset করে আবার নির্বাচন করো।");return}data.tournamentSize=Number(v);data.teams=data.teams||{};ALL_GROUPS.forEach((g,i)=>{if(!data.teams[g])data.teams[g]=defaultTeams[g]});save();fixturePage()}
function fixturePage(){let sizeBox=`<section class="panel"><h2>👥 Tournament Size</h2><p class="small">তুমি ১৬, ২৪, ৩২ বা ৪৮ Team দিয়ে Tournament আয়োজন করতে পারবে। Draw-এর আগে Size বেছে নাও।</p><select onchange="setTournamentSize(this.value)">${SIZE_OPTIONS.map(n=>`<option value="${n}" ${n===data.tournamentSize?"selected":""}>${n} Teams</option>`).join("")}</select></section>`;let draw=data.drawDone?`<section class="panel done"><h3>🎲 Random Group Draw</h3><p>এই টুর্নামেন্টের Draw একবার হয়ে গেছে। একই টুর্নামেন্টে আবার করা যাবে না।</p></section>`:`<section class="panel drawbox"><h2>🎲 Random Group Draw</h2><p class=small>৩২টি Team-কে A–H Group-এ ৪টি করে Randomভাবে ভাগ করা হবে। এক টুর্নামেন্টে শুধু একবার।</p><button class=primary onclick="randomGroupDraw()">🎲 Random Group Draw</button></section>`;main.innerHTML=sizeBox+draw+`<section class=panel><h2>📅 Fixtures</h2><p class=small>প্রতি গ্রুপে ৬টি ম্যাচ।</p></section><div class=grid>`+groups().map(g=>`<section class=card><h3>Group ${g}</h3>${fixtures().filter(x=>x.g===g).map(x=>`<div class=match><b>${esc((data.teamMeta[x.a]||{}).flag||"🏳️")} ${esc(x.a)}</b> vs <b>${esc(x.b)} ${(data.teamMeta[x.b]||{}).flag||"🏳️"}</b><div class=small>Match ${x.id.slice(1)}</div></div>`).join("")}</section>`).join("")+"</div>"}
async function ensureGroupsForSize(){
 const {data:gs,error}=await supabaseClient.from("groups").select("id,name,tournament_id").order("name");if(error)throw error;
 const existing={};(gs||[]).forEach(g=>existing[String(g.name).trim().toUpperCase()]=g);
 const first=gs?.[0];if(!first?.tournament_id)throw new Error("Tournament ID পাওয়া যায়নি");
 for(const g of groups()){if(!existing[g]){const {error:e}=await supabaseClient.from("groups").insert({name:g,tournament_id:first.tournament_id});if(e)throw e}}
}
async function randomGroupDraw(){
 if(data.drawDone){alert("এই টুর্নামেন্টে Random Draw আগেই করা হয়েছে।");return}
 if(!confirm(`${data.tournamentSize} Team Random Draw একবারই করা যাবে। শুরু করবো?`))return;
 if(!supabaseClient){alert("Supabase connection পাওয়া যাচ্ছে না।");return}
 try{
  const need=data.tournamentSize;
  await ensureGroupsForSize();
  const {data:rows,error}=await supabaseClient.from("teams").select("id,name,group_id").limit(100);
  if(error)throw error;
  if(!rows||rows.length<need){alert(`Supabase-এ অন্তত ${need}টি Team দরকার। এখন ${rows?.length||0}টি পাওয়া গেছে।`);return}
  const groupNames=groups();
  const {data:gs,error:ge}=await supabaseClient.from("groups").select("id,name,tournament_id").order("name");
  if(ge)throw ge;
  const gm={};(gs||[]).forEach(g=>gm[String(g.name).trim().toUpperCase()]=g.id);
  if(groupNames.some(g=>!gm[g]))throw new Error(`প্রয়োজনীয় Group ${groupNames.filter(g=>!gm[g]).join(", ")} Supabase-এ নেই।`);
  const shuffled=[...rows].sort(()=>Math.random()-0.5).slice(0,need);
  let k=0;
  for(const g of groupNames){for(let i=0;i<4;i++){const t=shuffled[k++];const {error:e}=await supabaseClient.from("teams").update({group_id:gm[g]}).eq("id",t.id);if(e)throw e}}
  // remove unused teams from active competition groups only by moving them to the last inactive group when possible
  const unused=rows.filter(t=>!shuffled.some(x=>x.id===t.id));
  const inactive=ALL_GROUPS.filter(g=>!groupNames.includes(g));
  if(inactive.length&&unused.length){let gi=0;for(const t of unused){const {error:e}=await supabaseClient.from("teams").update({group_id:gm[inactive[gi%inactive.length]]}).eq("id",t.id);if(e)throw e;gi++}}
  data.results={};data.knockout={};data.podium=null;data.status="active";data.drawDone=true;save();
  await rebuildGroupMatches();await loadTeamsFromSupabase();await loadResultsFromSupabase();
  alert(`🎉 ${need} Team Random Group Draw সম্পন্ন হয়েছে!`);fixturePage()
 }catch(e){console.error(e);alert("Random Draw হয়নি: "+(e.message||e))}}

async function rebuildGroupMatches(){if(!supabaseClient)return;const {data:ms,error}=await supabaseClient.from("matches").select("id,group_id,team_a_id,team_b_id,stage").eq("stage","group").order("id");if(error)throw error;const {data:gs,error:ge}=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)").order("name");if(ge)throw ge;for(const g of (gs||[])){const name=String(g.name).trim().toUpperCase();if(!groups().includes(name))continue;const list=(ms||[]).filter(m=>m.group_id===g.id);const ts=(g.teams||[]).slice(0,4);if(list.length<6||ts.length<4)continue;const pairs=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];for(let i=0;i<6;i++){const {error:e}=await supabaseClient.from("matches").update({team_a_id:ts[pairs[i][0]].id,team_b_id:ts[pairs[i][1]].id,score_a:null,score_b:null,status:"scheduled"}).eq("id",list[i].id);if(e)throw e}}}

function resultPage(){let f=fixtures();main.innerHTML=`<section class=panel><h2>📝 ম্যাচের ফলাফল</h2><p class=small>Group ম্যাচের Score Save করো।</p><p class=msg>জয়=৩, ড্র=১, হার=০</p></section><div class=grid>`+f.map(x=>{let r=data.results[x.id]||{};return `<section class=card><h3>Group ${x.g} • Match ${x.id.slice(1)}</h3><div class=row><b>${esc(x.a)}</b><input type=number min=0 id="${x.id}a" value="${r.a??''}"><input type=number min=0 id="${x.id}b" value="${r.b??''}"><b>${esc(x.b)}</b></div><br><button class=primary onclick="saveResult('${x.id}')">Save Result</button></section>`}).join("")+"</div>"}
async function saveResult(id){let a=Number(document.getElementById(id+"a").value),b=Number(document.getElementById(id+"b").value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){alert("দুই দলের Score দিন");return}data.results[id]={a,b};save();resultPage();if(supabaseClient){try{const m=fixtures().find(x=>x.id===id);const {data:gs,error:ge}=await supabaseClient.from("groups").select("id,name,teams(id,name,group_id)");if(ge)throw ge;const gr=(gs||[]).find(g=>String(g.name).trim().toUpperCase()===m.g);const A=(gr?.teams||[]).find(t=>t.name===m.a),B=(gr?.teams||[]).find(t=>t.name===m.b);if(!A||!B)throw new Error("Teams not found");const {data:ms,error:me}=await supabaseClient.from("matches").select("*").eq("group_id",gr.id).eq("stage","group");if(me)throw me;const mr=(ms||[]).find(x=>(x.team_a_id===A.id&&x.team_b_id===B.id)||(x.team_a_id===B.id&&x.team_b_id===A.id));if(!mr)throw new Error("Match not found");let patch={score_a:a,score_b:b,status:"completed"};if(mr.team_a_id===B.id&&mr.team_b_id===A.id){patch.score_a=b;patch.score_b=a}const {error:ue}=await supabaseClient.from("matches").update(patch).eq("id",mr.id);if(ue)throw ue}catch(e){console.warn(e)}}}
function stats(g){let s={};(data.teams[g]||[]).forEach(t=>s[t]={mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});fixtures().filter(x=>x.g===g).forEach(x=>{let r=data.results[x.id];if(!r||!s[x.a]||!s[x.b])return;let A=s[x.a],B=s[x.b];A.mp++;B.mp++;A.gf+=r.a;A.ga+=r.b;B.gf+=r.b;B.ga+=r.a;if(r.a>r.b){A.w++;A.pts+=3;B.l++}else if(r.a<r.b){B.w++;B.pts+=3;A.l++}else{A.d++;B.d++;A.pts++;B.pts++}});return s}
function table(g){let s=stats(g),arr=Object.entries(s).map(([team,v])=>({team,...v})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return `<h3>Group ${g}</h3><table><tr><th>#</th><th class=left>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>`+arr.map((x,i)=>`<tr class="${i<2?'ok':''}"><td>${i+1}</td><td class=left>${esc((data.teamMeta[x.team]||{}).flag||"🏳️")} ${esc(x.team)}</td><td>${x.mp}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join("")+"</table>"}
function groupPointsPage(){main.innerHTML=`<section class=panel><h2>📊 Group Points</h2><p class=small>প্রতি Group-এর Top 2 Team Knockout-এ যাবে।</p></section><div class=grid>`+groups().map(g=>`<section class=card>${table(g)}</section>`).join("")+`</div>`}
function groupRank(g){return Object.entries(stats(g)).map(([team,v])=>({team,...v})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function qualified(){let all=[];const n=data.tournamentSize;groups().forEach(g=>{let r=groupRank(g);r.forEach((x,i)=>all.push({...x,g,rank:i+1}))});if(n===16){let q=[];groups().forEach(g=>{q.push(...groupRank(g).slice(0,4).map(x=>x.team))});return q}if(n===24){let q=[];groups().forEach(g=>{q.push(...groupRank(g).slice(0,2).map(x=>x.team))});let thirds=[];groups().forEach(g=>{let r=groupRank(g);if(r[2])thirds.push({...r[2],g})});thirds.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);q.push(...thirds.slice(0,4).map(x=>x.team));return q}if(n===48){let q=[];groups().forEach(g=>{q.push(...groupRank(g).slice(0,2).map(x=>x.team))});let thirds=[];groups().forEach(g=>{let r=groupRank(g);if(r[2])thirds.push({...r[2],g})});thirds.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);q.push(...thirds.slice(0,8).map(x=>x.team));return q}let q=[];groups().forEach(g=>q.push(...groupRank(g).slice(0,2).map(x=>x.team)));return q}
function koDefaults(){let q=qualified();if(q.length<16)return {r16:Array.from({length:8},()=>({home:"TBD",away:"TBD"})),qf:[],sf:[],third:[],final:[]};let r16=[];for(let i=0;i<16;i+=2)r16.push({home:q[i]||"TBD",away:q[i+1]||"TBD"});return {r16,qf:[[],[],[],[]],sf:[[],[]],third:[],final:[]}}

function ensureKO(){if(!data.knockout||!data.knockout.r16||data.knockout.r16.length!==8)data.knockout=koDefaults();save()}
function teamFromMatch(m){if(!m||!m.home||!m.away)return null;return m.scoreA>m.scoreB?m.home:m.scoreB>m.scoreA?m.away:null}
function koCard(title,key,index,m){let home=m?.home||"TBD",away=m?.away||"TBD",sa=m?.scoreA, sb=m?.scoreB;return `<section class=card><h3>${title}</h3><p>${esc(home)} <b>vs</b> ${esc(away)}</p><div class=row><span></span><input type=number min=0 id="${key}${index}a" value="${sa??''}"><input type=number min=0 id="${key}${index}b" value="${sb??''}"><span></span></div><br><button class=primary onclick="saveKO('${key}',${index})">Save</button></section>`}
function knockoutPage(){ensureKO();let k=data.knockout;let r16=k.r16||[];let qf=k.qf||[[],[],[],[]];let sf=k.sf||[[],[]];let fin=k.final||[];let third=k.third||[];main.innerHTML=`<section class=panel knock><h2>🏆 Knockout Stage</h2><p class=small>Group Points থেকে Top 2 নিয়ে R16 তৈরি হয়। Score Save করলে পরের round-এর Team স্বয়ংক্রিয়ভাবে আসে।</p></section><section class=panel><h2>Round of 16</h2><div class=grid>${r16.map((m,i)=>koCard("R16 • Match "+(i+1),"r16",i,m)).join("")}</div></section><section class=panel><h2>Quarter Final</h2><div class=grid>${qf.map((m,i)=>koCard("QF • Match "+(i+1),"qf",i,{home:m?.home||"TBD",away:m?.away||"TBD",scoreA:m?.scoreA,scoreB:m?.scoreB})).join("")}</div></section><section class=panel><h2>Semi Final</h2><div class=grid>${sf.map((m,i)=>koCard("SF • Match "+(i+1),"sf",i,{home:m?.home||"TBD",away:m?.away||"TBD",scoreA:m?.scoreA,scoreB:m?.scoreB})).join("")}</div></section><section class=panel><h2>🥉 3rd Place</h2><div class=grid>${koCard("3rd Place","third",0,{home:third[0]?.home||"TBD",away:third[0]?.away||"TBD",scoreA:third[0]?.scoreA,scoreB:third[0]?.scoreB})}</div></section><section class=panel><h2>🏆 Final</h2><div class=grid>${koCard("Final","final",0,{home:fin[0]?.home||"TBD",away:fin[0]?.away||"TBD",scoreA:fin[0]?.scoreA,scoreB:fin[0]?.scoreB})}</div><button class=primary onclick="finishTournament()" ${canFinish()?"":"disabled"}>🏆 Finish Tournament</button><p class=small>${canFinish()?"Final ও 3rd Place সম্পন্ন। Tournament Finish করা যাবে।":"Final এবং 3rd Place-এর Score সম্পন্ন হলে Finish Tournament চালু হবে।"}</p></section>${data.status==="finished"?`<section class=panel>${podiumHTML()}</section>`:""}`}
function saveKO(key,i){let h=document.getElementById(key+i+"a"),b=document.getElementById(key+i+"b");let sa=Number(h.value),sb=Number(b.value);if(!Number.isInteger(sa)||!Number.isInteger(sb)||sa<0||sb<0){alert("দুই দলের Score দিন");return}ensureKO();let k=data.knockout;let arr=k[key];if(key==="third"||key==="final")arr=k[key];if(!arr[i])arr[i]={home:"TBD",away:"TBD"};arr[i].scoreA=sa;arr[i].scoreB=sb;if(sa===sb){alert("Knockout ম্যাচে ড্র হলে winner নির্ধারণের জন্য penalty দরকার। এখানে আপাতত ড্র গ্রহণ করা হয়নি।");arr[i].scoreA=null;arr[i].scoreB=null;save();knockoutPage();return}updateKO();save();knockoutPage()}
function updateKO(){let k=data.knockout;k.qf=[];for(let i=0;i<4;i++){let a=k.r16[i*2],b=k.r16[i*2+1];k.qf[i]={home:teamFromMatch(a)||"TBD",away:teamFromMatch(b)||"TBD"};if(a?.scoreA!=null&&b?.scoreA!=null&&k.qf[i].home!=="TBD"&&k.qf[i].away!=="TBD"&&k.qf[i].scoreA==null){} }
// preserve saved QF/SF/Final scores while refreshing teams
for(let i=0;i<4;i++){let old=(data.knockout.qf&&data.knockout.qf[i])||{};k.qf[i].scoreA=old.scoreA;k.qf[i].scoreB=old.scoreB}
k.sf=[];for(let i=0;i<2;i++){let a=k.qf[i*2],b=k.qf[i*2+1];k.sf[i]={home:teamFromMatch(a)||"TBD",away:teamFromMatch(b)||"TBD"};let old=(data.knockout.sf&&data.knockout.sf[i])||{};k.sf[i].scoreA=old.scoreA;k.sf[i].scoreB=old.scoreB}
let oldF=(data.knockout.final&&data.knockout.final[0])||{};k.final=[{home:teamFromMatch(k.sf[0])||"TBD",away:teamFromMatch(k.sf[1])||"TBD",scoreA:oldF.scoreA,scoreB:oldF.scoreB}];let oldT=(data.knockout.third&&data.knockout.third[0])||{};let lost1=k.sf[0]?(k.sf[0].home!=="TBD"&&k.sf[0].away!=="TBD"&&k.sf[0].scoreA!=null? (k.sf[0].scoreA>k.sf[0].scoreB?k.sf[0].away:k.sf[0].home):"TBD"):"TBD";let lost2=k.sf[1]?(k.sf[1].home!=="TBD"&&k.sf[1].away!=="TBD"&&k.sf[1].scoreA!=null? (k.sf[1].scoreA>k.sf[1].scoreB?k.sf[1].away:k.sf[1].home):"TBD"):"TBD";k.third=[{home:lost1,away:lost2,scoreA:oldT.scoreA,scoreB:oldT.scoreB}]}
function canFinish(){let f=data.knockout.final?.[0],t=data.knockout.third?.[0];return data.status!=="finished"&&f&&t&&f.home!=="TBD"&&f.away!=="TBD"&&t.home!=="TBD"&&t.away!=="TBD"&&Number.isInteger(f.scoreA)&&Number.isInteger(f.scoreB)&&f.scoreA!==f.scoreB&&Number.isInteger(t.scoreA)&&Number.isInteger(t.scoreB)&&t.scoreA!==t.scoreB}
function finishTournament(){if(!canFinish()){alert("Final এবং 3rd Place সম্পন্ন না হওয়া পর্যন্ত Tournament Finish করা যাবে না।");return}let f=data.knockout.final[0],t=data.knockout.third[0];data.podium={champion:teamFromMatch(f),runnerUp:f.scoreA>f.scoreB?f.away:f.home,third:teamFromMatch(t)};data.status="finished";save();alert("🏆 Tournament Finished! Champion, Runner-up ও 3rd Place Save হয়েছে।");knockoutPage()}
async function resetTournament(){if(!confirm("⚠️ এই Tournament-এর সব Result, Points, Knockout, Podium এবং Random Draw Reset হবে। নতুন Tournament শুরু করবেন?"))return;data.results={};data.knockout={};data.podium=null;data.drawDone=false;data.status="active";data.goalEvents=[];data.players={};save();if(supabaseClient){try{const {error}=await supabaseClient.from("matches").update({score_a:null,score_b:null,status:"scheduled"}).eq("stage","group");if(error)throw error}catch(e){console.warn("Supabase match reset failed",e);}}alert("🔄 Tournament Reset হয়েছে। এখন Fixtures-এ গিয়ে আবার Random Group Draw করো।");show("fixtures")}
function podiumHTML(){if(!data.podium)return"";let p=data.podium;function box(title,team,cls){let m=data.teamMeta[team]||{};return `<div class="place ${cls||""}"><h3>${title}</h3><div class=flag style="font-size:42px;margin:10px">${esc(m.flag||"🏳️")}</div><b>${esc(team||"—")}</b></div>`}return `<h2>🏆 Tournament Podium</h2><div class=podium>${box("🥇 Champion",p.champion,"champ")}${box("🥈 Runner-up",p.runnerUp)}${box("🥉 3rd Place",p.third)}</div>`}
function scorerRows(){
  const rows=[];
  groups().forEach(g=>(data.teams[g]||[]).forEach(team=>{
    const meta=data.teamMeta[team]||{};
    (data.players[team]||[]).forEach((player,i)=>{
      if(!player) return;
      const goals=data.goalEvents.filter(e=>e.team===team&&e.player===player).reduce((sum,e)=>sum+Number(e.goals||0),0);
      rows.push({player,team,flag:meta.flag||"🏳️",country:meta.country||"Unknown",goals});
    });
  }));
  return rows.sort((a,b)=>b.goals-a.goals||a.player.localeCompare(b.player));
}
function topScorersPage(){
  const rows=scorerRows();
  main.innerHTML=`<section class=panel><h2>⚽ Top Scorers</h2><p class=small>Player name তুমি Team Management-এ লিখবে। Goals এখানে নিজে থেকে হিসাব হবে; সরাসরি Goals পরিবর্তন করার ঘর নেই।</p></section><section class=card>${rows.length?`<div class="scorer"><b>#</b><b>Player</b><b>Team / Country</b><b>Goals</b></div>`+rows.map((x,i)=>`<div class="scorer"><span class=rank>${i+1}</span><span><b>${esc(x.player)}</b></span><span>${esc(x.flag)} <span class=country>${esc(x.country)}</span><br><span class=small>${esc(x.team)}</span></span><span class=goalbox>${x.goals}</span></div>`).join(""):`<p class=small>এখনো Player name দেওয়া হয়নি। Team Management-এ গিয়ে Player name লিখো।`}</section><section class=panel><h3>🎯 Goal Record</h3><p class=small>পরের ধাপে Match Results-এর সঙ্গে Goal Scorer যোগ করলে এই তালিকা ম্যাচের গোল অনুযায়ী স্বয়ংক্রিয়ভাবে আপডেট হবে।</p></section>`;
}
function announcePage(){main.innerHTML=`<section class=panel><h2>📢 Announcement</h2><textarea id=ann style="width:100%;min-height:150px;background:#0b1525;color:#fff;border:1px solid #334155;border-radius:8px;padding:10px">${esc(data.announcement)}</textarea><br><br><button class=primary onclick="saveAnn()">Publish Announcement</button></section><section class=panel><h3>Public Announcement Preview</h3><p>${esc(data.announcement)||"কোনো Announcement নেই।"}</p></section>`}
function saveAnn(){data.announcement=document.getElementById("ann").value;save();announcePage()}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
</script></body></html>
